name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (full build, including web UI)
        run: ./mvnw -B clean verify

      - name: Upload full jar (build artifact, not a release)
        uses: actions/upload-artifact@v7
        with:
          name: cluster-comparator-jar
          path: target/ClusterComparator-*-full.jar
          if-no-files-found: error
